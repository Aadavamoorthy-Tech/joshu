<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authentication Complete — Personal AI Chief of Staff</title>
</head>
<body>
  <p>Completing sign-in…</p>
  <script>
    // Relays the OAuth callback URL back to flutter_web_auth_2 on the same origin only.
    (function () {
      if (window.opener && window.opener !== window) {
        window.opener.postMessage(
          { 'flutter-web-auth-2': window.location.href },
          window.location.origin
        );
      }
      window.close();
    })();
  </script>
</body>
</html>

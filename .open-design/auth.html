<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshu - Personal AI Chief of Staff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-tertiary: #252d3d;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --accent-primary: #4a9eff;
            --accent-hover: #357abd;
            --border-color: #353d4f;
            --success: #34a853;
            --warning: #fbbc04;
            --danger: #ea4335;
            --purple: #a78bfa;
            --spacing-xs: 8px;
            --spacing-sm: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-md) var(--spacing-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent-primary);
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
            flex-wrap: wrap;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
        }

        .user-details {
            font-size: 14px;
        }

        .user-email {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-lg);
        }

        /* Capability Notice */
        .capability-bar {
            display: none;
            max-width: 1200px;
            margin: var(--spacing-md) auto 0;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            background: rgba(251, 188, 4, 0.1);
            border: 1px solid rgba(251, 188, 4, 0.35);
            color: #fde68a;
            font-size: 13px;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .capability-bar.visible {
            display: flex;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--spacing-xs);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: var(--accent-primary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--spacing-lg);
        }

        .tab-button {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: var(--spacing-md) 0;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-button.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }

        .tab-button:hover {
            color: var(--text-primary);
        }

        /* Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .task-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            transition: all 0.2s;
            cursor: pointer;
        }

        .task-item:hover {
            border-color: var(--accent-primary);
            background: #1f2636;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xs);
        }

        .task-title {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-primary);
        }

        .badge-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .task-status,
        .action-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .status-pending {
            background: rgba(251, 188, 4, 0.12);
            color: var(--warning);
        }

        .status-approved {
            background: rgba(52, 168, 83, 0.15);
            color: var(--success);
        }

        .status-rejected {
            background: rgba(234, 67, 53, 0.15);
            color: var(--danger);
        }

        .cat-reply_needed {
            background: rgba(74, 158, 255, 0.16);
            color: var(--accent-primary);
        }

        .cat-payment_request {
            background: rgba(251, 188, 4, 0.18);
            color: #fcd34d;
        }

        .cat-meeting_invite,
        .cat-meeting_rsvp {
            background: rgba(167, 139, 250, 0.18);
            color: var(--purple);
        }

        .cat-informational {
            background: rgba(154, 160, 166, 0.16);
            color: var(--text-secondary);
        }

        .task-meta {
            font-size: 12.5px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .task-description {
            color: var(--text-secondary);
            font-size: 13.5px;
            margin-bottom: var(--spacing-sm);
            line-height: 1.55;
        }

        .ai-prompt-box {
            background: rgba(74, 158, 255, 0.08);
            border: 1px solid rgba(74, 158, 255, 0.25);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin-bottom: var(--spacing-sm);
        }

        .ai-prompt-question {
            color: var(--text-primary);
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .ai-preview-detail {
            color: var(--text-secondary);
            font-size: 12.5px;
            white-space: pre-wrap;
        }

        .execution-receipt {
            background: rgba(52, 168, 83, 0.08);
            border: 1px solid rgba(52, 168, 83, 0.28);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            margin-bottom: var(--spacing-sm);
            font-size: 12.5px;
            color: #a7f3d0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .execution-receipt a {
            color: var(--accent-primary);
            text-decoration: underline;
        }

        .task-actions {
            display: flex;
            gap: var(--spacing-xs);
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: var(--spacing-xs);
        }

        /* Buttons */
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.45px;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn-success {
            background: rgba(52, 168, 83, 0.18);
            color: #6ee7b7;
            border: 1px solid rgba(52, 168, 83, 0.4);
        }

        .btn-success:hover:not(:disabled) {
            background: rgba(52, 168, 83, 0.28);
        }

        .btn-warning {
            background: rgba(251, 188, 4, 0.18);
            color: #fde68a;
            border: 1px solid rgba(251, 188, 4, 0.45);
        }

        .btn-warning:hover:not(:disabled) {
            background: rgba(251, 188, 4, 0.28);
        }

        .btn-danger {
            background: rgba(234, 67, 53, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(234, 67, 53, 0.35);
        }

        .btn-danger:hover:not(:disabled) {
            background: rgba(234, 67, 53, 0.26);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--border-color);
        }

        .btn-signin {
            background: var(--accent-primary);
            color: white;
            padding: var(--spacing-sm) var(--spacing-lg);
            font-size: 13px;
        }

        .btn-signin:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        /* Auth Container */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 200px);
            flex-direction: column;
            gap: var(--spacing-lg);
            text-align: center;
        }

        .auth-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 420px;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .auth-subtitle {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        /* Sync Status */
        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .sync-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
            animation: pulse 2s infinite;
        }

        .sync-indicator.synced {
            background: var(--success);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.74);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            width: 100%;
            max-width: 660px;
            max-height: 88vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }

        .modal-section {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-top: var(--spacing-md);
        }

        .modal-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--accent-primary);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: var(--spacing-xs);
        }

        .form-field.full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 11.5px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13.5px;
            padding: 8px 10px;
        }

        .form-textarea {
            min-height: 110px;
            resize: vertical;
            line-height: 1.5;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .payment-warning {
            font-size: 12px;
            color: #fde68a;
            margin-top: 6px;
        }

        .modal-footer {
            display: flex;
            gap: var(--spacing-xs);
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: var(--spacing-lg);
        }

        .modal-status-banner {
            display: none;
            margin-top: var(--spacing-md);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-size: 13px;
            line-height: 1.45;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .modal-status-banner.visible {
            display: block;
        }

        .modal-status-banner.error {
            background: rgba(234, 67, 53, 0.14);
            border-color: rgba(234, 67, 53, 0.45);
            color: #fca5a5;
        }

        .modal-status-banner.info {
            background: rgba(74, 158, 255, 0.14);
            border-color: rgba(74, 158, 255, 0.4);
            color: #b8d8ff;
        }

        .modal-status-banner.success {
            background: rgba(52, 168, 83, 0.15);
            border-color: rgba(52, 168, 83, 0.45);
            color: #a7f3d0;
        }

        /* Inline Status Banner */
        .status-banner {
            display: none;
            max-width: 1200px;
            margin: var(--spacing-md) auto 0;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-size: 13px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
        }

        .status-banner.visible {
            display: flex;
        }

        .status-banner.error {
            background: rgba(234, 67, 53, 0.12);
            border-color: rgba(234, 67, 53, 0.4);
            color: #f8b4ae;
        }

        .status-banner.info {
            background: rgba(74, 158, 255, 0.12);
            border-color: rgba(74, 158, 255, 0.35);
            color: #b8d8ff;
        }

        .status-banner.success {
            background: rgba(52, 168, 83, 0.14);
            border-color: rgba(52, 168, 83, 0.4);
            color: #a7f3d0;
        }

        .status-banner-close {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 2px 6px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">Joshu</div>
        <div class="header-actions">
            <div id="syncStatus" class="sync-status" style="display: none;">
                <div class="sync-indicator" id="syncIndicator"></div>
                <span id="syncLabel">Synced</span>
            </div>
            <button id="syncNowBtn" class="btn btn-secondary" style="display: none;">Sync Inbox</button>
            <div id="userInfo" class="user-info" style="display: none;">
                <div class="avatar" id="userAvatar">J</div>
                <div>
                    <div id="userName" class="user-details"></div>
                    <div id="userEmail" class="user-email"></div>
                </div>
            </div>
            <button id="logoutBtn" class="btn btn-secondary" style="display: none;">Logout</button>
        </div>
    </div>

    <div id="capabilityBar" class="capability-bar">
        <span id="capabilityText"></span>
        <button id="reconnectGoogleBtn" class="btn btn-warning" type="button">Reconnect Google</button>
    </div>

    <div id="statusBanner" class="status-banner" role="alert">
        <span id="statusBannerText"></span>
        <button id="statusBannerClose" class="status-banner-close" type="button" aria-label="Dismiss">×</button>
    </div>

    <!-- Main Content -->
    <div class="container" id="mainContent" style="display: none;">
        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Approved</div>
                <div class="stat-value" id="approvedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Rejected</div>
                <div class="stat-value" id="rejectedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-button active" data-tab="all">All Tasks</button>
            <button class="tab-button" data-tab="pending">Pending</button>
            <button class="tab-button" data-tab="approved">Approved</button>
            <button class="tab-button" data-tab="rejected">Rejected</button>
        </div>

        <!-- Tasks -->
        <div class="task-list" id="taskList">
            <div class="empty-state">
                <div class="empty-state-icon">✓</div>
                <div class="empty-state-title">No tasks yet</div>
                <p>Click Sync Inbox to fetch and analyze your messages.</p>
            </div>
        </div>
    </div>

    <!-- Auth Container -->
    <div id="authContainer" class="auth-container">
        <div class="auth-box">
            <div class="auth-title">Joshu</div>
            <div class="auth-subtitle">Personal AI Chief of Staff</div>
            <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg); font-size: 14px;">
                AI-powered inbox triage, drafted replies, automatic payments, Google Calendar scheduling, and smart inbox archiving.
            </p>
            <button id="authSignInBtn" class="btn btn-signin" style="width: 100%;">Sign In with Google</button>
        </div>
    </div>

    <!-- Task Detail & Action Execution Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle"></div>
            <div id="modalBody"></div>
            <div id="modalStatusBanner" class="modal-status-banner" role="alert"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="reanalyzeBtnModal" type="button">Analyze with AI</button>
                <button class="btn btn-secondary" id="closeModalBtn" type="button">Close</button>
                <button class="btn btn-danger" id="rejectBtnModal" type="button">Reject &amp; Archive</button>
                <button class="btn btn-success" id="approveBtnModal" type="button">Approve &amp; Execute</button>
            </div>
        </div>
    </div>

    <script>
        let apiBase = window.location.origin;
        let sessionToken = null;
        let isAuthenticated = false;
        let currentUser = null;
        let capabilities = null;
        let currentTaskId = null;
        let currentFilter = 'all';
        let tasks = [];
        let listenersBound = false;

        // Clear any legacy token previously saved in localStorage
        try { localStorage.removeItem('sessionToken'); } catch (_) {}

        function buildAuthHeaders(extra = {}) {
            const headers = { 'X-Requested-With': 'fetch', ...extra };
            if (sessionToken) {
                headers['Authorization'] = `Bearer ${sessionToken}`;
            }
            return headers;
        }

        async function resolveApiBase() {
            const host = window.location.hostname;
            const isLocal = host === 'localhost' || host === '127.0.0.1';
            if (!isLocal) {
                apiBase = window.location.origin;
                return;
            }
            try {
                const probe = await fetch(`${window.location.origin}/api/config`, {
                    credentials: 'include',
                });
                if (probe.ok) {
                    apiBase = window.location.origin;
                    return;
                }
            } catch (_) {}
            apiBase = `http://${host}:8000`;
        }

        function showBanner(message, type = 'error') {
            const banner = document.getElementById('statusBanner');
            const textEl = document.getElementById('statusBannerText');
            textEl.textContent = message;
            banner.className = `status-banner visible ${type}`;

            const modal = document.getElementById('taskModal');
            const modalBanner = document.getElementById('modalStatusBanner');
            if (modal && modalBanner && modal.classList.contains('active')) {
                modalBanner.textContent = message;
                modalBanner.className = `modal-status-banner visible ${type}`;
                modalBanner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function hideModalBanner() {
            const modalBanner = document.getElementById('modalStatusBanner');
            if (modalBanner) {
                modalBanner.className = 'modal-status-banner';
                modalBanner.textContent = '';
            }
        }

        function hideBanner() {
            const banner = document.getElementById('statusBanner');
            banner.className = 'status-banner';
            document.getElementById('statusBannerText').textContent = '';
            hideModalBanner();
        }

        function extractErrorMessage(data, fallback) {
            if (!data) return fallback;
            if (typeof data.message === 'string' && data.message.trim()) return data.message;
            if (typeof data.detail === 'string' && data.detail.trim()) return data.detail;
            if (Array.isArray(data.detail) && data.detail.length > 0) {
                const first = data.detail[0];
                if (first && typeof first.msg === 'string') {
                    const loc = Array.isArray(first.loc) ? first.loc.join('.') : '';
                    return loc ? `${loc}: ${first.msg}` : first.msg;
                }
            }
            return fallback;
        }

        function updateCapabilityBanner() {
            const bar = document.getElementById('capabilityBar');
            const textEl = document.getElementById('capabilityText');
            const reconnectBtn = document.getElementById('reconnectGoogleBtn');
            if (!isAuthenticated || !capabilities) {
                bar.classList.remove('visible');
                return;
            }
            const missingScopes = [];
            if (!capabilities.gmail_send) missingScopes.push('Gmail Send');
            if (!capabilities.gmail_modify) missingScopes.push('Gmail Mark-Read/Folder Move');
            if (!capabilities.calendar_events) missingScopes.push('Google Calendar');

            if (missingScopes.length > 0) {
                textEl.textContent = `Reconnect Google once to grant ${missingScopes.join(', ')} permissions for automatic execution.`;
                reconnectBtn.style.display = 'inline-block';
                bar.classList.add('visible');
            } else if (!capabilities.ai_configured) {
                textEl.textContent = 'Add GEMINI_API_KEY in backend/.env and restart the backend to enable automatic email comprehension and reply drafting.';
                reconnectBtn.style.display = 'none';
                bar.classList.add('visible');
            } else {
                bar.classList.remove('visible');
            }
        }

        async function parseJsonSafe(response) {
            const raw = await response.text();
            if (!raw) return {};
            try {
                return JSON.parse(raw);
            } catch (_) {
                return { message: raw.slice(0, 200) };
            }
        }

        function setupEventListeners() {
            if (listenersBound) return;
            listenersBound = true;

            document.getElementById('authSignInBtn').addEventListener('click', () => startSignIn(false));
            document.getElementById('reconnectGoogleBtn').addEventListener('click', () => startSignIn(true));
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('syncNowBtn').addEventListener('click', () => syncInboxNow(false));
            document.getElementById('statusBannerClose').addEventListener('click', hideBanner);
            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('reanalyzeBtnModal').addEventListener('click', reanalyzeCurrentTask);
            document.getElementById('approveBtnModal').addEventListener('click', approveCurrentTaskFromModal);
            document.getElementById('rejectBtnModal').addEventListener('click', rejectCurrentTask);

            document.getElementById('taskModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeModal();
            });

            document.querySelectorAll('.tab-button').forEach((btn) => {
                btn.addEventListener('click', () => filterTasks(btn.dataset.tab, btn));
            });

            window.addEventListener('message', (event) => {
                if (event.origin !== window.location.origin) return;
                const payload = event.data;
                if (!payload || payload.type !== 'joshu-google-oauth') return;
                if (payload.exchange_code) {
                    redeemExchangeCode(payload.exchange_code);
                } else if (payload.error) {
                    showBanner(String(payload.error), 'error');
                }
            });
        }

        function setSyncState(syncing, label) {
            const box = document.getElementById('syncStatus');
            const indicator = document.getElementById('syncIndicator');
            const labelEl = document.getElementById('syncLabel');
            box.style.display = 'flex';
            indicator.classList.toggle('synced', !syncing);
            labelEl.textContent = label;
        }

        async function startSignIn(forceConsent = false) {
            hideBanner();
            const signInButtons = [
                document.getElementById('authSignInBtn'),
                document.getElementById('reconnectGoogleBtn'),
            ];
            signInButtons.forEach((b) => { if (b) b.disabled = true; });

            try {
                const redirectUri = `${window.location.origin}/auth.html`;
                const response = await fetch(`${apiBase}/auth/signin`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({
                        redirect_uri: redirectUri,
                        force_consent: Boolean(forceConsent),
                    })
                });

                const data = await parseJsonSafe(response);
                if (!response.ok) {
                    showBanner('Sign-in failed: ' + (data.message || `HTTP ${response.status}`), 'error');
                    return;
                }

                const targetUrl = data.redirect_url || data.auth_url;
                if (targetUrl && targetUrl.startsWith('https://')) {
                    window.location.href = targetUrl;
                } else {
                    showBanner('No valid redirect URL received from server.', 'error');
                }
            } catch (error) {
                showBanner('Failed to start sign-in process: ' + error.message, 'error');
            } finally {
                signInButtons.forEach((b) => { if (b) b.disabled = false; });
            }
        }

        async function redeemExchangeCode(exchangeCode) {
            hideBanner();
            try {
                const response = await fetch(`${apiBase}/api/auth/google/exchange`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ exchange_code: exchangeCode })
                });
                const data = await parseJsonSafe(response);
                if (response.ok && data.session_token) {
                    sessionToken = data.session_token;
                    isAuthenticated = true;
                    currentUser = data.user || (data.session ? { name: data.session.display_name, email: data.session.email } : null);
                    updateHeader();
                    showMainContent();
                    await fetchCapabilities();
                    await syncInboxNow(true);
                } else {
                    showBanner('Authentication failed: ' + (data.message || 'Invalid sign-in code.'), 'error');
                    showAuthContainer();
                }
            } catch (error) {
                showBanner('Authentication failed: ' + error.message, 'error');
                showAuthContainer();
            }
        }

        async function handleOAuthCallback(code, state) {
            if (window.oauthProcessing) return;
            window.oauthProcessing = true;
            hideBanner();

            try {
                const callbackUrl = `${apiBase}/auth/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;
                const response = await fetch(callbackUrl, {
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                const data = await parseJsonSafe(response);

                if (response.ok && data.session_token) {
                    sessionToken = data.session_token;
                    isAuthenticated = true;
                    currentUser = data.user || (data.session ? { name: data.session.display_name, email: data.session.email } : null);
                    updateHeader();
                    showMainContent();
                    await fetchCapabilities();
                    await syncInboxNow(true);
                } else {
                    showBanner('Authentication failed: ' + (data.message || 'Unexpected response from server.'), 'error');
                    showAuthContainer();
                }
            } catch (error) {
                showBanner('Authentication failed: ' + error.message, 'error');
                showAuthContainer();
            } finally {
                window.oauthProcessing = false;
            }
        }

        async function fetchCapabilities() {
            try {
                const res = await fetch(`${apiBase}/auth/me`, {
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                if (res.ok) {
                    const data = await parseJsonSafe(res);
                    capabilities = data.capabilities || null;
                    updateCapabilityBanner();
                }
            } catch (_) {}
        }

        async function restoreSession() {
            try {
                const response = await fetch(`${apiBase}/auth/me`, {
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                if (!response.ok) {
                    isAuthenticated = false;
                    sessionToken = null;
                    currentUser = null;
                    capabilities = null;
                    updateCapabilityBanner();
                    showAuthContainer();
                    return false;
                }
                const data = await parseJsonSafe(response);
                isAuthenticated = true;
                currentUser = data.user || (data.session ? { name: data.session.display_name, email: data.session.email } : null);
                capabilities = data.capabilities || null;
                updateHeader();
                showMainContent();
                updateCapabilityBanner();
                await loadTasks();
                if (tasks.length === 0) {
                    await syncInboxNow(true);
                }
                return true;
            } catch (_) {
                isAuthenticated = false;
                showAuthContainer();
                return false;
            }
        }

        async function loadTasks() {
            if (!isAuthenticated) return;
            setSyncState(true, 'Loading...');
            try {
                const response = await fetch(`${apiBase}/tasks?limit=100`, {
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                if (response.status === 401) {
                    logout();
                    return;
                }
                const data = await parseJsonSafe(response);
                tasks = Array.isArray(data.tasks) ? data.tasks : [];
                updateStats(data.counts || computeCounts(tasks));
                renderFilteredTasks();
                setSyncState(false, 'Synced');
            } catch (error) {
                setSyncState(false, 'Sync error');
                showBanner('Failed to load tasks: ' + error.message, 'error');
            }
        }

        async function syncInboxNow(silent = false) {
            if (!isAuthenticated) return;
            if (!silent) hideBanner();
            const btn = document.getElementById('syncNowBtn');
            btn.disabled = true;
            setSyncState(true, 'Syncing...');
            try {
                const response = await fetch(`${apiBase}/tasks/sync`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                const data = await parseJsonSafe(response);
                if (response.status === 401) {
                    showBanner(data.message || 'Session expired. Please sign in again.', 'error');
                    logout();
                    return;
                }
                if (!response.ok) {
                    showBanner(data.message || 'Could not sync inbox right now.', 'error');
                    setSyncState(false, 'Sync error');
                    await loadTasks();
                    return;
                }
                await loadTasks();
                const created = Number(data.created_tasks || 0);
                const fetched = Number(data.fetched_messages ?? tasks.length);
                if (!silent || created > 0) {
                    const summary = created > 0
                        ? `Synced ${created} new item${created === 1 ? '' : 's'} from your inbox.`
                        : fetched === 0 && tasks.length === 0
                            ? 'Connected to Gmail, but this mailbox currently has no messages to import.'
                            : `Inbox is up to date (${tasks.length} item${tasks.length === 1 ? '' : 's'} loaded).`;
                    showBanner(summary, 'info');
                }
            } catch (error) {
                setSyncState(false, 'Sync error');
                showBanner('Inbox sync failed: ' + error.message, 'error');
                await loadTasks();
            } finally {
                btn.disabled = false;
            }
        }

        async function analyzeSingleTask(taskId) {
            if (!isAuthenticated) return null;
            setSyncState(true, 'Analyzing...');
            try {
                const response = await fetch(`${apiBase}/tasks/${encodeURIComponent(taskId)}/analyze`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                const data = await parseJsonSafe(response);
                if (!response.ok) {
                    showBanner(data.message || 'AI analysis failed.', 'error');
                    setSyncState(false, 'Synced');
                    return null;
                }
                await loadTasks();
                showBanner('Email analyzed and action plan updated.', 'success');
                return data.task || null;
            } catch (error) {
                showBanner('AI analysis failed: ' + error.message, 'error');
                setSyncState(false, 'Synced');
                return null;
            }
        }

        function computeCounts(list) {
            return {
                all: list.length,
                pending: list.filter((t) => t.status === 'pending').length,
                approved: list.filter((t) => t.status === 'approved').length,
                rejected: list.filter((t) => t.status === 'rejected').length,
            };
        }

        function updateHeader() {
            if (currentUser) {
                const displayName = String(currentUser.name || currentUser.email || 'User');
                const email = String(currentUser.email || '');
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('syncNowBtn').style.display = 'inline-block';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                document.getElementById('userName').textContent = displayName;
                document.getElementById('userEmail').textContent = email;
                const initials = displayName
                    .split(/\s+/)
                    .filter(Boolean)
                    .slice(0, 2)
                    .map((n) => n[0])
                    .join('')
                    .toUpperCase() || 'J';
                document.getElementById('userAvatar').textContent = initials;
            }
        }

        function updateStats(counts) {
            document.getElementById('pendingCount').textContent = String(counts.pending ?? 0);
            document.getElementById('approvedCount').textContent = String(counts.approved ?? 0);
            document.getElementById('rejectedCount').textContent = String(counts.rejected ?? 0);
            document.getElementById('totalCount').textContent = String(counts.all ?? 0);
        }

        function formatSchedule(iso) {
            if (!iso) return 'No scheduled time';
            const dt = new Date(iso);
            if (Number.isNaN(dt.getTime())) return 'No scheduled time';
            return `${dt.toLocaleDateString()} at ${dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        }

        function toLocalDateTimeInputValue(iso) {
            if (!iso) return '';
            const dt = new Date(iso);
            if (Number.isNaN(dt.getTime())) return '';
            const pad = (n) => String(n).padStart(2, '0');
            return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
        }

        function fromLocalDateTimeInputValue(val) {
            if (!val) return null;
            const dt = new Date(val);
            if (Number.isNaN(dt.getTime())) return null;
            return dt.toISOString();
        }

        function normalizeStatus(status) {
            return ['pending', 'approved', 'rejected'].includes(status) ? status : 'pending';
        }

        function getCategoryMeta(task) {
            const ai = task.ai_analysis || null;
            const category = (ai && ai.category) || task.action_category || 'informational';
            const labels = {
                reply_needed: 'Reply Drafted',
                payment_request: 'Payment Request',
                meeting_invite: 'Meeting · Calendar',
                meeting_rsvp: 'RSVP + Calendar',
                informational: 'Review',
            };
            return {
                category: labels[category] ? category : 'informational',
                label: labels[category] || 'Review',
            };
        }

        function getPrimaryApproveLabel(task) {
            const ai = task.ai_analysis;
            if (ai) {
                if (ai.requires_rsvp) return 'Send RSVP & Add to Calendar';
                if (ai.requires_payment) {
                    const amt = ai.payment && Number(ai.payment.amount) > 0
                        ? `${Number(ai.payment.amount).toFixed(2)} ${ai.payment.currency || 'USD'}`
                        : 'Payment';
                    return `Approve & Pay ${amt}`;
                }
                if (ai.requires_calendar) return 'Add to Calendar';
                if (ai.requires_reply) return 'Send Reply';
                return 'Approve & Archive';
            }
            if (task.source === 'calendar') return 'Add to Calendar';
            return 'Approve & Archive';
        }

        function renderExecutionReceipt(container, log) {
            if (!log || typeof log !== 'object') return;
            const entries = [];
            if (log.reply && log.reply.sent) {
                entries.push({ text: `✓ Reply sent to ${log.reply.to}` });
            }
            if (log.calendar && log.calendar.created) {
                entries.push({
                    text: `✓ Added to Google Calendar (${formatSchedule(log.calendar.start)})`,
                    link: log.calendar.html_link,
                    linkLabel: 'Open in Calendar',
                });
            }
            if (log.payment && log.payment.executed) {
                entries.push({
                    text: `✓ Payment executed: ${Number(log.payment.amount).toFixed(2)} ${log.payment.currency} to ${log.payment.payee_name} (${log.payment.payment_id})`,
                });
            }
            if (log.gmail_archive && log.gmail_archive.processed) {
                entries.push({
                    text: `✓ Marked read & moved out of Inbox to ${log.gmail_archive.folder}`,
                });
            }
            if (!entries.length) return;

            const box = document.createElement('div');
            box.className = 'execution-receipt';
            entries.forEach((entry) => {
                const row = document.createElement('div');
                row.appendChild(document.createTextNode(entry.text));
                if (entry.link && /^https:\/\//i.test(entry.link)) {
                    row.appendChild(document.createTextNode(' · '));
                    const a = document.createElement('a');
                    a.href = entry.link;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.textContent = entry.linkLabel || 'View';
                    a.addEventListener('click', (e) => e.stopPropagation());
                    row.appendChild(a);
                }
                box.appendChild(row);
            });
            container.appendChild(box);
        }

        function renderFilteredTasks() {
            if (currentFilter === 'all') {
                displayTasks(tasks);
            } else {
                displayTasks(tasks.filter((t) => t.status === currentFilter));
            }
        }

        function displayTasks(tasksToShow) {
            const list = document.getElementById('taskList');
            list.replaceChildren();

            if (!tasksToShow.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';

                const icon = document.createElement('div');
                icon.className = 'empty-state-icon';
                icon.textContent = '✓';

                const title = document.createElement('div');
                title.className = 'empty-state-title';
                title.textContent = 'All caught up!';

                const desc = document.createElement('p');
                desc.textContent = 'No tasks to show for this filter. Click Sync Inbox to check for new messages.';

                empty.append(icon, title, desc);
                list.appendChild(empty);
                return;
            }

            tasksToShow.forEach((task) => {
                const status = normalizeStatus(task.status);
                const catMeta = getCategoryMeta(task);
                const ai = task.ai_analysis || null;

                const item = document.createElement('div');
                item.className = 'task-item';
                item.addEventListener('click', () => openTaskModal(task.id));

                const header = document.createElement('div');
                header.className = 'task-header';

                const titleEl = document.createElement('div');
                titleEl.className = 'task-title';
                titleEl.textContent = task.title || '(No Subject)';

                const badgeGroup = document.createElement('div');
                badgeGroup.className = 'badge-group';

                const catEl = document.createElement('div');
                catEl.className = `action-badge cat-${catMeta.category}`;
                catEl.textContent = catMeta.label;

                const statusEl = document.createElement('div');
                statusEl.className = `task-status status-${status}`;
                statusEl.textContent = status;

                badgeGroup.append(catEl, statusEl);
                header.append(titleEl, badgeGroup);

                const metaEl = document.createElement('div');
                metaEl.className = 'task-meta';
                const scheduleText = formatSchedule(task.scheduled_for);
                metaEl.textContent = task.organizer ? `${scheduleText} · ${task.organizer}` : scheduleText;

                const descEl = document.createElement('div');
                descEl.className = 'task-description';
                descEl.textContent = (ai && ai.summary) || task.snippet || task.description || '';

                item.append(header, metaEl, descEl);

                if (status === 'pending' && ai) {
                    const promptBox = document.createElement('div');
                    promptBox.className = 'ai-prompt-box';

                    const qEl = document.createElement('div');
                    qEl.className = 'ai-prompt-question';
                    qEl.textContent = ai.recommended_action || task.recommended_action || 'Approve this action?';
                    promptBox.appendChild(qEl);

                    const details = [];
                    if (ai.requires_payment && ai.payment) {
                        const amt = Number(ai.payment.amount || 0).toFixed(2);
                        details.push(`Payment: ${amt} ${ai.payment.currency || 'USD'} to ${ai.payment.payee_name || 'Vendor'}${ai.payment.invoice_number ? ` (Invoice ${ai.payment.invoice_number})` : ''}`);
                    }
                    if (ai.requires_calendar && ai.calendar_event) {
                        details.push(`Calendar: ${ai.calendar_event.title || task.title} · ${formatSchedule(ai.calendar_event.start_iso || task.scheduled_for)}`);
                    }
                    if ((ai.requires_reply || ai.requires_rsvp) && ai.draft_reply && ai.draft_reply.body) {
                        const preview = ai.draft_reply.body.length > 160
                            ? `${ai.draft_reply.body.slice(0, 160)}...`
                            : ai.draft_reply.body;
                        details.push(`Draft to ${ai.draft_reply.to || task.organizer}: "${preview}"`);
                    }
                    if (details.length) {
                        const detailEl = document.createElement('div');
                        detailEl.className = 'ai-preview-detail';
                        detailEl.textContent = details.join('\n');
                        promptBox.appendChild(detailEl);
                    }
                    item.appendChild(promptBox);
                }

                renderExecutionReceipt(item, task.execution_log);

                const actionsEl = document.createElement('div');
                actionsEl.className = 'task-actions';

                if (status === 'pending') {
                    if (!ai) {
                        const analyzeBtn = document.createElement('button');
                        analyzeBtn.className = 'btn btn-secondary';
                        analyzeBtn.type = 'button';
                        analyzeBtn.textContent = 'Analyze with AI';
                        analyzeBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            analyzeSingleTask(task.id);
                        });
                        actionsEl.appendChild(analyzeBtn);
                    } else {
                        const reviewBtn = document.createElement('button');
                        reviewBtn.className = 'btn btn-secondary';
                        reviewBtn.type = 'button';
                        reviewBtn.textContent = ai.requires_reply || ai.requires_rsvp ? 'Review / Edit Draft' : 'Review Details';
                        reviewBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openTaskModal(task.id);
                        });
                        actionsEl.appendChild(reviewBtn);
                    }

                    const rejectBtn = document.createElement('button');
                    rejectBtn.className = 'btn btn-danger';
                    rejectBtn.type = 'button';
                    rejectBtn.textContent = 'Reject';
                    rejectBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        rejectTask(task.id);
                    });

                    const approveBtn = document.createElement('button');
                    approveBtn.className = ai && ai.requires_payment ? 'btn btn-warning' : 'btn btn-success';
                    approveBtn.type = 'button';
                    approveBtn.textContent = getPrimaryApproveLabel(task);
                    approveBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // Payments always open the confirmation modal first so the user verifies payee & amount.
                        if (ai && ai.requires_payment) {
                            openTaskModal(task.id);
                            return;
                        }
                        approveTask(task.id, null);
                    });

                    actionsEl.append(rejectBtn, approveBtn);
                }

                item.appendChild(actionsEl);
                list.appendChild(item);
            });
        }

        function filterTasks(filter, clickedBtn) {
            currentFilter = filter || 'all';
            document.querySelectorAll('.tab-button').forEach((btn) => btn.classList.remove('active'));
            if (clickedBtn) {
                clickedBtn.classList.add('active');
            }
            renderFilteredTasks();
        }

        async function approveTask(taskId, payload = null) {
            hideBanner();
            setSyncState(true, 'Executing...');
            try {
                const options = {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders(payload ? { 'Content-Type': 'application/json' } : {}),
                };
                if (payload) {
                    options.body = JSON.stringify(payload);
                }
                const response = await fetch(`${apiBase}/tasks/${encodeURIComponent(taskId)}/approve`, options);
                const data = await parseJsonSafe(response);
                if (!response.ok) {
                    setSyncState(false, 'Synced');
                    showBanner(extractErrorMessage(data, `Action failed (HTTP ${response.status}).`), 'error');
                    if (data.error === 'scope_upgrade_required') {
                        await fetchCapabilities();
                    }
                    return false;
                }
                await loadTasks();
                showBanner(data.message || 'Action completed successfully.', 'success');
                return true;
            } catch (error) {
                setSyncState(false, 'Synced');
                showBanner('Failed to execute action: ' + error.message, 'error');
                return false;
            }
        }

        async function rejectTask(taskId) {
            hideBanner();
            setSyncState(true, 'Archiving...');
            try {
                const response = await fetch(`${apiBase}/tasks/${encodeURIComponent(taskId)}/reject`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ mark_read_and_move: true }),
                });
                const data = await parseJsonSafe(response);
                if (!response.ok) {
                    setSyncState(false, 'Synced');
                    showBanner(data.message || 'Failed to reject task.', 'error');
                    return false;
                }
                await loadTasks();
                showBanner(data.message || 'Task rejected and archived.', 'info');
                return true;
            } catch (error) {
                setSyncState(false, 'Synced');
                showBanner('Failed to reject task: ' + error.message, 'error');
                return false;
            }
        }

        function appendDetailRow(container, label, value) {
            const p = document.createElement('p');
            p.style.marginBottom = '6px';
            const strong = document.createElement('strong');
            strong.textContent = `${label}: `;
            p.appendChild(strong);
            p.appendChild(document.createTextNode(value));
            container.appendChild(p);
        }

        function createField(labelText, inputEl, fullWidth = false) {
            const wrap = document.createElement('div');
            wrap.className = fullWidth ? 'form-field full' : 'form-field';
            const lbl = document.createElement('label');
            lbl.className = 'form-label';
            lbl.textContent = labelText;
            wrap.append(lbl, inputEl);
            return wrap;
        }

        function openTaskModal(taskId) {
            const task = tasks.find((t) => t.id === taskId);
            if (!task) return;

            currentTaskId = taskId;
            const ai = task.ai_analysis || null;
            const isPending = task.status === 'pending';

            document.getElementById('modalTitle').textContent = task.title || '(No Subject)';

            const body = document.getElementById('modalBody');
            body.replaceChildren();

            const wrapper = document.createElement('div');
            wrapper.style.color = 'var(--text-secondary)';
            wrapper.style.fontSize = '13.5px';

            appendDetailRow(wrapper, 'Status', normalizeStatus(task.status));
            appendDetailRow(wrapper, 'Action Type', getCategoryMeta(task).label);
            appendDetailRow(wrapper, 'Date / Schedule', formatSchedule(task.scheduled_for));
            if (task.organizer) {
                appendDetailRow(wrapper, 'From', String(task.organizer));
            }
            if (ai && ai.summary) {
                appendDetailRow(wrapper, 'AI Summary', ai.summary);
            }
            if (task.ai_analysis_error) {
                appendDetailRow(wrapper, 'AI Notice', task.ai_analysis_error);
            }
            if (task.calendar_event_link && /^https:\/\//i.test(task.calendar_event_link)) {
                const linkRow = document.createElement('p');
                linkRow.style.marginBottom = '6px';
                const strong = document.createElement('strong');
                strong.textContent = 'Calendar / Event Link: ';
                const anchor = document.createElement('a');
                anchor.href = task.calendar_event_link;
                anchor.target = '_blank';
                anchor.rel = 'noopener noreferrer';
                anchor.style.color = 'var(--accent-primary)';
                anchor.textContent = task.calendar_event_link;
                linkRow.append(strong, anchor);
                wrapper.appendChild(linkRow);
            }

            renderExecutionReceipt(wrapper, task.execution_log);

            // Original email message section
            const emailSection = document.createElement('div');
            emailSection.className = 'modal-section';
            const emailHeader = document.createElement('div');
            emailHeader.className = 'modal-section-header';
            emailHeader.textContent = 'Original Email Content';
            const descText = document.createElement('p');
            descText.style.whiteSpace = 'pre-wrap';
            descText.style.maxHeight = '140px';
            descText.style.overflowY = 'auto';
            descText.style.color = 'var(--text-secondary)';
            descText.textContent = task.description || 'No message body.';
            emailSection.append(emailHeader, descText);
            wrapper.appendChild(emailSection);

            if (isPending) {
                const raw = task.raw_data || {};

                // 1. Draft Reply / RSVP Section
                const replyDefaultOn = Boolean(ai && (ai.requires_reply || ai.requires_rsvp));
                const draft = (ai && ai.draft_reply) || {};
                const replySection = document.createElement('div');
                replySection.className = 'modal-section';

                const replyHead = document.createElement('div');
                replyHead.className = 'modal-section-header';
                const replyToggleLabel = document.createElement('label');
                replyToggleLabel.className = 'checkbox-label';
                const replyCheck = document.createElement('input');
                replyCheck.type = 'checkbox';
                replyCheck.id = 'modalSendReplyCheck';
                replyCheck.checked = replyDefaultOn;
                replyToggleLabel.append(replyCheck, document.createTextNode(ai && ai.requires_rsvp ? 'Send RSVP Reply Email' : 'Send Drafted Reply Email'));
                replyHead.appendChild(replyToggleLabel);
                replySection.appendChild(replyHead);

                const replyGrid = document.createElement('div');
                replyGrid.className = 'form-grid';

                const toInput = document.createElement('input');
                toInput.className = 'form-input';
                toInput.id = 'modalReplyTo';
                toInput.value = draft.to || raw.reply_to || task.organizer || '';

                const subjInput = document.createElement('input');
                subjInput.className = 'form-input';
                subjInput.id = 'modalReplySubject';
                subjInput.value = draft.subject || (task.title && task.title.toLowerCase().startsWith('re:') ? task.title : `Re: ${task.title || ''}`);

                const bodyArea = document.createElement('textarea');
                bodyArea.className = 'form-textarea';
                bodyArea.id = 'modalReplyBody';
                bodyArea.placeholder = 'Write or edit the email reply to send on approval...';
                bodyArea.value = draft.body || '';

                replyGrid.append(
                    createField('To', toInput),
                    createField('Subject', subjInput),
                    createField('Draft Message', bodyArea, true)
                );
                replySection.appendChild(replyGrid);
                wrapper.appendChild(replySection);

                // 2. Google Calendar Section
                const calDefaultOn = Boolean((ai && (ai.requires_calendar || ai.requires_rsvp)) || task.source === 'calendar');
                const cal = (ai && ai.calendar_event) || {};
                const calSection = document.createElement('div');
                calSection.className = 'modal-section';

                const calHead = document.createElement('div');
                calHead.className = 'modal-section-header';
                const calToggleLabel = document.createElement('label');
                calToggleLabel.className = 'checkbox-label';
                const calCheck = document.createElement('input');
                calCheck.type = 'checkbox';
                calCheck.id = 'modalAddCalendarCheck';
                calCheck.checked = calDefaultOn;
                calToggleLabel.append(calCheck, document.createTextNode('Add Meeting to Google Calendar'));
                calHead.appendChild(calToggleLabel);
                calSection.appendChild(calHead);

                const calGrid = document.createElement('div');
                calGrid.className = 'form-grid';

                const calTitleInput = document.createElement('input');
                calTitleInput.className = 'form-input';
                calTitleInput.id = 'modalCalTitle';
                calTitleInput.value = cal.title || task.title || '';

                const calLocInput = document.createElement('input');
                calLocInput.className = 'form-input';
                calLocInput.id = 'modalCalLocation';
                calLocInput.value = cal.location || raw.location || '';

                const calStartInput = document.createElement('input');
                calStartInput.className = 'form-input';
                calStartInput.type = 'datetime-local';
                calStartInput.id = 'modalCalStart';
                calStartInput.value = toLocalDateTimeInputValue(cal.start_iso || task.scheduled_for);

                const calEndInput = document.createElement('input');
                calEndInput.className = 'form-input';
                calEndInput.type = 'datetime-local';
                calEndInput.id = 'modalCalEnd';
                calEndInput.value = toLocalDateTimeInputValue(cal.end_iso || raw.end_time);

                calGrid.append(
                    createField('Event Title', calTitleInput),
                    createField('Location / Link', calLocInput),
                    createField('Start Date & Time', calStartInput),
                    createField('End Date & Time', calEndInput)
                );
                calSection.appendChild(calGrid);
                wrapper.appendChild(calSection);

                // 3. Automatic Payment Section
                const payDefaultOn = Boolean(ai && ai.requires_payment);
                const pay = (ai && ai.payment) || {};
                const paySection = document.createElement('div');
                paySection.className = 'modal-section';

                const payHead = document.createElement('div');
                payHead.className = 'modal-section-header';
                const payToggleLabel = document.createElement('label');
                payToggleLabel.className = 'checkbox-label';
                const payCheck = document.createElement('input');
                payCheck.type = 'checkbox';
                payCheck.id = 'modalExecutePaymentCheck';
                payCheck.checked = payDefaultOn;
                payToggleLabel.append(payCheck, document.createTextNode('Execute Payment Automatically'));
                payHead.appendChild(payToggleLabel);
                paySection.appendChild(payHead);

                const payGrid = document.createElement('div');
                payGrid.className = 'form-grid';

                const payeeInput = document.createElement('input');
                payeeInput.className = 'form-input';
                payeeInput.id = 'modalPayee';
                payeeInput.value = pay.payee_name || task.organizer || '';

                const amtInput = document.createElement('input');
                amtInput.className = 'form-input';
                amtInput.type = 'number';
                amtInput.step = '0.01';
                amtInput.min = '0';
                amtInput.id = 'modalPayAmount';
                amtInput.value = pay.amount && Number(pay.amount) > 0 ? String(pay.amount) : '';

                const curInput = document.createElement('input');
                curInput.className = 'form-input';
                curInput.id = 'modalPayCurrency';
                curInput.maxLength = 3;
                curInput.value = pay.currency || 'INR';

                const invInput = document.createElement('input');
                invInput.className = 'form-input';
                invInput.readOnly = true;
                invInput.value = pay.invoice_number || pay.payment_reference || 'N/A';

                const upiInput = document.createElement('input');
                upiInput.className = 'form-input';
                upiInput.id = 'modalPayUpi';
                upiInput.placeholder = 'e.g. vendor@icici or merchant@okaxis';
                upiInput.value = pay.payee_upi_id || '';

                const bankInput = document.createElement('input');
                bankInput.className = 'form-input';
                bankInput.id = 'modalPayBankAcct';
                bankInput.placeholder = 'Optional if using UPI';
                bankInput.value = pay.payee_bank_account || '';

                const ifscInput = document.createElement('input');
                ifscInput.className = 'form-input';
                ifscInput.id = 'modalPayIfsc';
                ifscInput.maxLength = 11;
                ifscInput.placeholder = 'e.g. HDFC0001234';
                ifscInput.value = pay.payee_ifsc || '';

                payGrid.append(
                    createField('Payee', payeeInput),
                    createField('Amount', amtInput),
                    createField('Currency', curInput),
                    createField('Invoice / Ref', invInput),
                    createField('UPI ID (VPA)', upiInput, true),
                    createField('Bank Account Number', bankInput),
                    createField('IFSC Code', ifscInput)
                );
                paySection.appendChild(payGrid);

                const warnEl = document.createElement('div');
                warnEl.className = 'payment-warning';
                warnEl.textContent = 'When checked, approving immediately submits this payout via RazorpayX (UPI/IMPS/NEFT) or your configured payment gateway with duplicate-payout protection.';
                paySection.appendChild(warnEl);
                wrapper.appendChild(paySection);

                // 4. Inbox Cleanup Section
                const archiveSection = document.createElement('div');
                archiveSection.className = 'modal-section';
                const archiveLabel = document.createElement('label');
                archiveLabel.className = 'checkbox-label';
                const archiveCheck = document.createElement('input');
                archiveCheck.type = 'checkbox';
                archiveCheck.id = 'modalArchiveCheck';
                archiveCheck.checked = true;
                const folderName = (ai && ai.target_folder) || (capabilities && capabilities.processed_folder) || 'Joshu/Processed';
                archiveLabel.append(
                    archiveCheck,
                    document.createTextNode(`Mark email as read and move out of Inbox to "${folderName}"`)
                );
                archiveSection.appendChild(archiveLabel);
                wrapper.appendChild(archiveSection);
            }

            body.appendChild(wrapper);

            const modal = document.getElementById('taskModal');
            const approveBtn = document.getElementById('approveBtnModal');
            const rejectBtn = document.getElementById('rejectBtnModal');
            const reanalyzeBtn = document.getElementById('reanalyzeBtnModal');

            if (isPending) {
                approveBtn.style.display = 'inline-block';
                approveBtn.textContent = getPrimaryApproveLabel(task);
                approveBtn.className = ai && ai.requires_payment ? 'btn btn-warning' : 'btn btn-success';
                rejectBtn.style.display = 'inline-block';
                reanalyzeBtn.style.display = 'inline-block';
            } else {
                approveBtn.style.display = 'none';
                rejectBtn.style.display = 'none';
                reanalyzeBtn.style.display = 'none';
            }

            hideModalBanner();
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            hideModalBanner();
            currentTaskId = null;
        }

        async function reanalyzeCurrentTask() {
            if (!currentTaskId) return;
            const id = currentTaskId;
            const btn = document.getElementById('reanalyzeBtnModal');
            btn.disabled = true;
            try {
                const updated = await analyzeSingleTask(id);
                if (updated) {
                    openTaskModal(id);
                }
            } finally {
                btn.disabled = false;
            }
        }

        async function approveCurrentTaskFromModal() {
            if (!currentTaskId) return;
            const id = currentTaskId;
            const sendReply = Boolean(document.getElementById('modalSendReplyCheck')?.checked);
            const addCalendar = Boolean(document.getElementById('modalAddCalendarCheck')?.checked);
            const executePayment = Boolean(document.getElementById('modalExecutePaymentCheck')?.checked);
            const markReadAndMove = Boolean(document.getElementById('modalArchiveCheck')?.checked);

            const payload = {
                send_reply: sendReply,
                add_to_calendar: addCalendar,
                execute_payment: executePayment,
                mark_read_and_move: markReadAndMove,
            };

            if (sendReply) {
                payload.reply_to = document.getElementById('modalReplyTo')?.value?.trim() || null;
                payload.reply_subject = document.getElementById('modalReplySubject')?.value?.trim() || null;
                payload.reply_body = document.getElementById('modalReplyBody')?.value || '';
            }
            if (addCalendar) {
                payload.calendar_title = document.getElementById('modalCalTitle')?.value?.trim() || null;
                payload.calendar_location = document.getElementById('modalCalLocation')?.value?.trim() || '';
                payload.calendar_start_iso = fromLocalDateTimeInputValue(document.getElementById('modalCalStart')?.value);
                payload.calendar_end_iso = fromLocalDateTimeInputValue(document.getElementById('modalCalEnd')?.value);
            }
            if (executePayment) {
                const amtVal = parseFloat(document.getElementById('modalPayAmount')?.value || '0');
                if (!Number.isFinite(amtVal) || amtVal <= 0) {
                    showBanner('Please enter a valid positive payment amount before approving.', 'error');
                    return;
                }
                payload.payment_amount = amtVal;
                payload.payment_currency = (document.getElementById('modalPayCurrency')?.value || 'INR').trim().toUpperCase();
                payload.payment_payee = document.getElementById('modalPayee')?.value?.trim() || null;
                payload.payment_upi_id = document.getElementById('modalPayUpi')?.value?.trim() || '';
                payload.payment_bank_account = document.getElementById('modalPayBankAcct')?.value?.trim() || '';
                payload.payment_ifsc = (document.getElementById('modalPayIfsc')?.value || '').trim().toUpperCase();
            }

            const btn = document.getElementById('approveBtnModal');
            const originalLabel = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Processing...';
            try {
                const ok = await approveTask(id, payload);
                if (ok) closeModal();
            } finally {
                btn.disabled = false;
                btn.textContent = originalLabel;
            }
        }

        async function rejectCurrentTask() {
            if (!currentTaskId) return;
            const id = currentTaskId;
            const btn = document.getElementById('rejectBtnModal');
            const originalLabel = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Archiving...';
            try {
                const ok = await rejectTask(id);
                if (ok) closeModal();
            } finally {
                btn.disabled = false;
                btn.textContent = originalLabel;
            }
        }

        async function logout() {
            const headers = buildAuthHeaders();
            const wasSignedIn = isAuthenticated || Boolean(sessionToken);
            sessionToken = null;
            isAuthenticated = false;
            currentUser = null;
            capabilities = null;
            tasks = [];
            updateCapabilityBanner();
            try { localStorage.removeItem('sessionToken'); } catch (_) {}

            if (wasSignedIn) {
                try {
                    await fetch(`${apiBase}/auth/logout`, {
                        method: 'POST',
                        credentials: 'include',
                        headers,
                    });
                } catch (_) {}
            }
            showAuthContainer();
        }

        function showAuthContainer() {
            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('syncStatus').style.display = 'none';
            document.getElementById('syncNowBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('capabilityBar').classList.remove('visible');
        }

        function showMainContent() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        async function bootstrap() {
            setupEventListeners();
            await resolveApiBase();

            const hash = window.location.hash || '';
            const hashMatch = hash.match(/oauth_code=([^&]+)/);
            const hashExchangeCode = hashMatch && hashMatch[1] ? decodeURIComponent(hashMatch[1]) : null;

            const params = new URLSearchParams(window.location.search);
            const exchangeCode = hashExchangeCode || params.get('exchange_code');
            const code = params.get('code');
            const state = params.get('state');
            const oauthError = params.get('oauth_error') || params.get('error');

            if (window.location.search || hashExchangeCode) {
                window.history.replaceState({}, document.title, window.location.pathname || '/');
            }

            if (oauthError) {
                showAuthContainer();
                showBanner(oauthError, 'error');
                return;
            }

            if (exchangeCode) {
                await redeemExchangeCode(exchangeCode);
                return;
            }

            if (code && state) {
                await handleOAuthCallback(code, state);
                return;
            }

            await restoreSession();
        }

        bootstrap();
    </script>
</body>
</html>

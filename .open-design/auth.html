<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshu - Personal AI Chief of Staff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-tertiary: #252d3d;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --accent-primary: #4a9eff;
            --accent-hover: #357abd;
            --border-color: #353d4f;
            --success: #34a853;
            --warning: #fbbc04;
            --danger: #ea4335;
            --spacing-xs: 8px;
            --spacing-sm: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent-primary);
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
        }

        .user-details {
            font-size: 14px;
        }

        .user-email {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-lg);
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--spacing-xs);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: var(--accent-primary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--spacing-lg);
        }

        .tab-button {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: var(--spacing-md) 0;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-button.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }

        .tab-button:hover {
            color: var(--text-primary);
        }

        /* Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .task-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            transition: all 0.2s;
            cursor: pointer;
        }

        .task-item:hover {
            border-color: var(--accent-primary);
            background: var(--bg-tertiary);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-sm);
        }

        .task-title {
            font-weight: 600;
            color: var(--text-primary);
        }

        .task-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(251, 188, 4, 0.1);
            color: var(--warning);
        }

        .status-approved {
            background: rgba(52, 168, 83, 0.1);
            color: var(--success);
        }

        .status-rejected {
            background: rgba(234, 67, 53, 0.1);
            color: var(--danger);
        }

        .task-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .task-description {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: var(--spacing-md);
            line-height: 1.6;
        }

        .task-actions {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
        }

        /* Buttons */
        .btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-success {
            background: rgba(52, 168, 83, 0.15);
            color: var(--success);
            border: 1px solid rgba(52, 168, 83, 0.3);
        }

        .btn-success:hover {
            background: rgba(52, 168, 83, 0.25);
        }

        .btn-danger {
            background: rgba(234, 67, 53, 0.15);
            color: var(--danger);
            border: 1px solid rgba(234, 67, 53, 0.3);
        }

        .btn-danger:hover {
            background: rgba(234, 67, 53, 0.25);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-signin {
            background: var(--accent-primary);
            color: white;
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: 14px;
        }

        .btn-signin:hover {
            background: var(--accent-hover);
        }

        /* Auth Container */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 200px);
            flex-direction: column;
            gap: var(--spacing-lg);
            text-align: center;
        }

        .auth-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 400px;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .auth-subtitle {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        /* Sync Status */
        .sync-status {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
        }

        .sync-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
            animation: pulse 2s infinite;
        }

        .sync-indicator.synced {
            background: var(--success);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: var(--spacing-lg);
            color: var(--text-primary);
        }

        .modal-footer {
            display: flex;
            gap: var(--spacing-md);
            justify-content: flex-end;
            margin-top: var(--spacing-lg);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Inline Status Banner */
        .status-banner {
            display: none;
            max-width: 1200px;
            margin: var(--spacing-md) auto 0;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-size: 13px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
        }

        .status-banner.visible {
            display: flex;
        }

        .status-banner.error {
            background: rgba(234, 67, 53, 0.12);
            border-color: rgba(234, 67, 53, 0.4);
            color: #f8b4ae;
        }

        .status-banner.info {
            background: rgba(74, 158, 255, 0.12);
            border-color: rgba(74, 158, 255, 0.35);
            color: #b8d8ff;
        }

        .status-banner-close {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 2px 6px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">Joshu</div>
        <div class="header-actions">
            <div id="syncStatus" class="sync-status" style="display: none; margin-bottom: 0;">
                <div class="sync-indicator" id="syncIndicator"></div>
                <span id="syncLabel">Synced</span>
            </div>
            <button id="syncNowBtn" class="btn btn-secondary" style="display: none;">Sync Inbox</button>
            <div id="userInfo" class="user-info" style="display: none;">
                <div class="avatar" id="userAvatar">J</div>
                <div>
                    <div id="userName" class="user-details"></div>
                    <div id="userEmail" class="user-email"></div>
                </div>
            </div>
            <button id="signInBtn" class="btn btn-signin">Sign In with Google</button>
            <button id="logoutBtn" class="btn btn-secondary" style="display: none;">Logout</button>
        </div>
    </div>

    <div id="statusBanner" class="status-banner" role="alert">
        <span id="statusBannerText"></span>
        <button id="statusBannerClose" class="status-banner-close" type="button" aria-label="Dismiss">×</button>
    </div>

    <!-- Main Content -->
    <div class="container" id="mainContent" style="display: none;">
        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Approved</div>
                <div class="stat-value" id="approvedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Rejected</div>
                <div class="stat-value" id="rejectedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-button active" data-tab="all">All Tasks</button>
            <button class="tab-button" data-tab="pending">Pending</button>
            <button class="tab-button" data-tab="approved">Approved</button>
            <button class="tab-button" data-tab="rejected">Rejected</button>
        </div>

        <!-- Tasks -->
        <div class="task-list" id="taskList">
            <div class="empty-state">
                <div class="empty-state-icon">📧</div>
                <div class="empty-state-title">No tasks yet</div>
                <p>Your approved and rejected meeting invitations will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Auth Container -->
    <div id="authContainer" class="auth-container">
        <div class="auth-box">
            <div class="auth-title">Joshu</div>
            <div class="auth-subtitle">Personal AI Chief of Staff</div>
            <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg); font-size: 14px;">
                Manage your meeting invitations and tasks in one place.
            </p>
            <button id="authSignInBtn" class="btn btn-signin" style="width: 100%;">Sign In with Google</button>
        </div>
    </div>

    <!-- Task Detail Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle"></div>
            <div id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="closeModalBtn" type="button">Close</button>
                <button class="btn btn-danger" id="rejectBtnModal" type="button">Reject</button>
                <button class="btn btn-success" id="approveBtnModal" type="button">Approve</button>
            </div>
        </div>
    </div>

    <script>
        let apiBase = window.location.origin;
        let sessionToken = null;
        let isAuthenticated = false;
        let currentUser = null;
        let currentTaskId = null;
        let currentFilter = 'all';
        let tasks = [];
        let listenersBound = false;

        // Clear any legacy token previously saved in localStorage
        try { localStorage.removeItem('sessionToken'); } catch (_) {}

        function buildAuthHeaders(extra = {}) {
            const headers = { 'X-Requested-With': 'fetch', ...extra };
            if (sessionToken) {
                headers['Authorization'] = `Bearer ${sessionToken}`;
            }
            return headers;
        }

        async function resolveApiBase() {
            const host = window.location.hostname;
            const isLocal = host === 'localhost' || host === '127.0.0.1';
            if (!isLocal) {
                apiBase = window.location.origin;
                return;
            }
            try {
                const probe = await fetch(`${window.location.origin}/api/config`, {
                    credentials: 'include',
                });
                if (probe.ok) {
                    apiBase = window.location.origin;
                    return;
                }
            } catch (_) {}
            apiBase = `http://${host}:8000`;
        }

        function showBanner(message, type = 'error') {
            const banner = document.getElementById('statusBanner');
            const textEl = document.getElementById('statusBannerText');
            textEl.textContent = message;
            banner.className = `status-banner visible ${type}`;
        }

        function hideBanner() {
            const banner = document.getElementById('statusBanner');
            banner.className = 'status-banner';
            document.getElementById('statusBannerText').textContent = '';
        }

        async function parseJsonSafe(response) {
            const raw = await response.text();
            if (!raw) return {};
            try {
                return JSON.parse(raw);
            } catch (_) {
                return { message: raw.slice(0, 200) };
            }
        }

        function setupEventListeners() {
            if (listenersBound) return;
            listenersBound = true;

            document.getElementById('signInBtn').addEventListener('click', startSignIn);
            document.getElementById('authSignInBtn').addEventListener('click', startSignIn);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('syncNowBtn').addEventListener('click', () => syncInboxNow(false));
            document.getElementById('statusBannerClose').addEventListener('click', hideBanner);
            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('approveBtnModal').addEventListener('click', approveCurrentTask);
            document.getElementById('rejectBtnModal').addEventListener('click', rejectCurrentTask);

            document.getElementById('taskModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeModal();
            });

            document.querySelectorAll('.tab-button').forEach((btn) => {
                btn.addEventListener('click', () => filterTasks(btn.dataset.tab, btn));
            });

            window.addEventListener('message', (event) => {
                if (event.origin !== window.location.origin) return;
                const payload = event.data;
                if (!payload || payload.type !== 'joshu-google-oauth') return;
                if (payload.exchange_code) {
                    redeemExchangeCode(payload.exchange_code);
                } else if (payload.error) {
                    showBanner(String(payload.error), 'error');
                }
            });
        }

        function setSyncState(syncing, label) {
            const box = document.getElementById('syncStatus');
            const indicator = document.getElementById('syncIndicator');
            const labelEl = document.getElementById('syncLabel');
            box.style.display = 'flex';
            indicator.classList.toggle('synced', !syncing);
            labelEl.textContent = label;
        }

        async function startSignIn() {
            hideBanner();
            const signInButtons = [
                document.getElementById('signInBtn'),
                document.getElementById('authSignInBtn'),
            ];
            signInButtons.forEach((b) => { b.disabled = true; });

            try {
                const redirectUri = `${window.location.origin}/auth.html`;
                const response = await fetch(`${apiBase}/auth/signin`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ redirect_uri: redirectUri })
                });

                const data = await parseJsonSafe(response);
                if (!response.ok) {
                    showBanner('Sign-in failed: ' + (data.message || `HTTP ${response.status}`), 'error');
                    return;
                }

                const targetUrl = data.redirect_url || data.auth_url;
                if (targetUrl && targetUrl.startsWith('https://')) {
                    window.location.href = targetUrl;
                } else {
                    showBanner('No valid redirect URL received from server.', 'error');
                }
            } catch (error) {
                showBanner('Failed to start sign-in process: ' + error.message, 'error');
            } finally {
                signInButtons.forEach((b) => { b.disabled = false; });
            }
        }

        async function redeemExchangeCode(exchangeCode) {
            hideBanner();
            try {
                const response = await fetch(`${apiBase}/api/auth/google/exchange`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ exchange_code: exchangeCode })
                });
                const data = await parseJsonSafe(response);
                if (response.ok && data.session_token) {
                    sessionToken = data.session_token;
                    isAuthenticated = true;
                    currentUser = data.user || (data.session ? { name: data.session.display_name, email: data.session.email } : null);
                    updateHeader();
                    showMainContent();
                    await syncInboxNow(true);
                } else {
                    showBanner('Authentication failed: ' + (data.message || 'Invalid sign-in code.'), 'error');
                    showAuthContainer();
                }
            } catch (error) {
                showBanner('Authentication failed: ' + error.message, 'error');
                showAuthContainer();
            }
        }

        async function handleOAuthCallback(code, state) {
            if (window.oauthProcessing) return;
            window.oauthProcessing = true;
            hideBanner();

            try {
                const callbackUrl = `${apiBase}/auth/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;
                const response = await fetch(callbackUrl, {
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                const data = await parseJsonSafe(response);

                if (response.ok && data.session_token) {
                    sessionToken = data.session_token;
                    isAuthenticated = true;
                    currentUser = data.user || (data.session ? { name: data.session.display_name, email: data.session.email } : null);
                    updateHeader();
                    showMainContent();
                    await syncInboxNow(true);
                } else {
                    showBanner('Authentication failed: ' + (data.message || 'Unexpected response from server.'), 'error');
                    showAuthContainer();
                }
            } catch (error) {
                showBanner('Authentication failed: ' + error.message, 'error');
                showAuthContainer();
            } finally {
                window.oauthProcessing = false;
            }
        }

        async function restoreSession() {
            try {
                const response = await fetch(`${apiBase}/auth/me`, {
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                if (!response.ok) {
                    isAuthenticated = false;
                    sessionToken = null;
                    currentUser = null;
                    showAuthContainer();
                    return false;
                }
                const data = await parseJsonSafe(response);
                isAuthenticated = true;
                currentUser = data.user || (data.session ? { name: data.session.display_name, email: data.session.email } : null);
                updateHeader();
                showMainContent();
                await loadTasks();
                if (tasks.length === 0) {
                    await syncInboxNow(true);
                }
                return true;
            } catch (_) {
                isAuthenticated = false;
                showAuthContainer();
                return false;
            }
        }

        async function loadTasks() {
            if (!isAuthenticated) return;
            setSyncState(true, 'Loading...');
            try {
                const response = await fetch(`${apiBase}/tasks?limit=100`, {
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                if (response.status === 401) {
                    logout();
                    return;
                }
                const data = await parseJsonSafe(response);
                tasks = Array.isArray(data.tasks) ? data.tasks : [];
                updateStats(data.counts || computeCounts(tasks));
                renderFilteredTasks();
                setSyncState(false, 'Synced');
            } catch (error) {
                setSyncState(false, 'Sync error');
                showBanner('Failed to load tasks: ' + error.message, 'error');
            }
        }

        async function syncInboxNow(silent = false) {
            if (!isAuthenticated) return;
            if (!silent) hideBanner();
            const btn = document.getElementById('syncNowBtn');
            btn.disabled = true;
            setSyncState(true, 'Syncing...');
            try {
                const response = await fetch(`${apiBase}/tasks/sync`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                const data = await parseJsonSafe(response);
                if (response.status === 401) {
                    showBanner(data.message || 'Session expired. Please sign in again.', 'error');
                    logout();
                    return;
                }
                if (!response.ok) {
                    showBanner(data.message || 'Could not sync inbox right now.', 'error');
                    setSyncState(false, 'Sync error');
                    await loadTasks();
                    return;
                }
                await loadTasks();
                const created = Number(data.created_tasks || 0);
                const fetched = Number(data.fetched_messages ?? tasks.length);
                if (!silent || created > 0) {
                    const summary = created > 0
                        ? `Synced ${created} new item${created === 1 ? '' : 's'} from your inbox.`
                        : fetched === 0 && tasks.length === 0
                            ? 'Connected to Gmail, but this mailbox currently has no messages to import.'
                            : `Inbox is up to date (${tasks.length} item${tasks.length === 1 ? '' : 's'} loaded).`;
                    showBanner(summary, 'info');
                }
            } catch (error) {
                setSyncState(false, 'Sync error');
                showBanner('Inbox sync failed: ' + error.message, 'error');
                await loadTasks();
            } finally {
                btn.disabled = false;
            }
        }

        function computeCounts(list) {
            return {
                all: list.length,
                pending: list.filter((t) => t.status === 'pending').length,
                approved: list.filter((t) => t.status === 'approved').length,
                rejected: list.filter((t) => t.status === 'rejected').length,
            };
        }

        function updateHeader() {
            if (currentUser) {
                const displayName = String(currentUser.name || currentUser.email || 'User');
                const email = String(currentUser.email || '');
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('syncNowBtn').style.display = 'inline-block';
                document.getElementById('signInBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                document.getElementById('userName').textContent = displayName;
                document.getElementById('userEmail').textContent = email;
                const initials = displayName
                    .split(/\s+/)
                    .filter(Boolean)
                    .slice(0, 2)
                    .map((n) => n[0])
                    .join('')
                    .toUpperCase() || 'J';
                document.getElementById('userAvatar').textContent = initials;
            }
        }

        function updateStats(counts) {
            document.getElementById('pendingCount').textContent = String(counts.pending ?? 0);
            document.getElementById('approvedCount').textContent = String(counts.approved ?? 0);
            document.getElementById('rejectedCount').textContent = String(counts.rejected ?? 0);
            document.getElementById('totalCount').textContent = String(counts.all ?? 0);
        }

        function formatSchedule(iso) {
            if (!iso) return 'No scheduled time';
            const dt = new Date(iso);
            if (Number.isNaN(dt.getTime())) return 'No scheduled time';
            return `${dt.toLocaleDateString()} at ${dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        }

        function normalizeStatus(status) {
            return ['pending', 'approved', 'rejected'].includes(status) ? status : 'pending';
        }

        function renderFilteredTasks() {
            if (currentFilter === 'all') {
                displayTasks(tasks);
            } else {
                displayTasks(tasks.filter((t) => t.status === currentFilter));
            }
        }

        function displayTasks(tasksToShow) {
            const list = document.getElementById('taskList');
            list.replaceChildren();

            if (!tasksToShow.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';

                const icon = document.createElement('div');
                icon.className = 'empty-state-icon';
                icon.textContent = '✓';

                const title = document.createElement('div');
                title.className = 'empty-state-title';
                title.textContent = 'All caught up!';

                const desc = document.createElement('p');
                desc.textContent = 'No tasks to show for this filter. Click Sync Inbox to check for new messages.';

                empty.append(icon, title, desc);
                list.appendChild(empty);
                return;
            }

            tasksToShow.forEach((task) => {
                const status = normalizeStatus(task.status);
                const item = document.createElement('div');
                item.className = 'task-item';
                item.addEventListener('click', () => openTaskModal(task.id));

                const header = document.createElement('div');
                header.className = 'task-header';

                const titleEl = document.createElement('div');
                titleEl.className = 'task-title';
                titleEl.textContent = task.title || '(No Subject)';

                const statusEl = document.createElement('div');
                statusEl.className = `task-status status-${status}`;
                statusEl.textContent = status;

                header.append(titleEl, statusEl);

                const metaEl = document.createElement('div');
                metaEl.className = 'task-meta';
                const scheduleText = formatSchedule(task.scheduled_for);
                metaEl.textContent = task.organizer ? `${scheduleText} · ${task.organizer}` : scheduleText;

                const descEl = document.createElement('div');
                descEl.className = 'task-description';
                descEl.textContent = task.snippet || task.description || '';

                const actionsEl = document.createElement('div');
                actionsEl.className = 'task-actions';

                if (status === 'pending') {
                    const rejectBtn = document.createElement('button');
                    rejectBtn.className = 'btn btn-danger';
                    rejectBtn.type = 'button';
                    rejectBtn.textContent = 'Reject';
                    rejectBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        rejectTask(task.id);
                    });

                    const approveBtn = document.createElement('button');
                    approveBtn.className = 'btn btn-success';
                    approveBtn.type = 'button';
                    approveBtn.textContent = 'Approve';
                    approveBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        approveTask(task.id);
                    });

                    actionsEl.append(rejectBtn, approveBtn);
                }

                item.append(header, metaEl, descEl, actionsEl);
                list.appendChild(item);
            });
        }

        function filterTasks(filter, clickedBtn) {
            currentFilter = filter || 'all';
            document.querySelectorAll('.tab-button').forEach((btn) => btn.classList.remove('active'));
            if (clickedBtn) {
                clickedBtn.classList.add('active');
            }
            renderFilteredTasks();
        }

        async function approveTask(taskId) {
            try {
                const response = await fetch(`${apiBase}/tasks/${encodeURIComponent(taskId)}/approve`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                if (!response.ok) {
                    const data = await parseJsonSafe(response);
                    showBanner(data.message || 'Failed to approve task.', 'error');
                    return;
                }
                await loadTasks();
            } catch (error) {
                showBanner('Failed to approve task: ' + error.message, 'error');
            }
        }

        async function rejectTask(taskId) {
            try {
                const response = await fetch(`${apiBase}/tasks/${encodeURIComponent(taskId)}/reject`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: buildAuthHeaders(),
                });
                if (!response.ok) {
                    const data = await parseJsonSafe(response);
                    showBanner(data.message || 'Failed to reject task.', 'error');
                    return;
                }
                await loadTasks();
            } catch (error) {
                showBanner('Failed to reject task: ' + error.message, 'error');
            }
        }

        function appendDetailRow(container, label, value) {
            const p = document.createElement('p');
            p.style.marginBottom = '6px';
            const strong = document.createElement('strong');
            strong.textContent = `${label}: `;
            p.appendChild(strong);
            p.appendChild(document.createTextNode(value));
            container.appendChild(p);
        }

        function openTaskModal(taskId) {
            const task = tasks.find((t) => t.id === taskId);
            if (!task) return;

            currentTaskId = taskId;
            document.getElementById('modalTitle').textContent = task.title || '(No Subject)';

            const body = document.getElementById('modalBody');
            body.replaceChildren();

            const wrapper = document.createElement('div');
            wrapper.style.color = 'var(--text-secondary)';
            wrapper.style.fontSize = '14px';

            appendDetailRow(wrapper, 'Status', normalizeStatus(task.status));
            appendDetailRow(wrapper, 'Scheduled', formatSchedule(task.scheduled_for));
            appendDetailRow(wrapper, 'Source', String(task.source || 'email'));
            if (task.organizer) {
                appendDetailRow(wrapper, 'From', String(task.organizer));
            }
            if (task.calendar_event_link && /^https:\/\//i.test(task.calendar_event_link)) {
                const linkRow = document.createElement('p');
                linkRow.style.marginBottom = '6px';
                const strong = document.createElement('strong');
                strong.textContent = 'Link: ';
                const anchor = document.createElement('a');
                anchor.href = task.calendar_event_link;
                anchor.target = '_blank';
                anchor.rel = 'noopener noreferrer';
                anchor.style.color = 'var(--accent-primary)';
                anchor.textContent = task.calendar_event_link;
                linkRow.append(strong, anchor);
                wrapper.appendChild(linkRow);
            }

            const descLabel = document.createElement('p');
            descLabel.style.marginTop = 'var(--spacing-md)';
            const strongDesc = document.createElement('strong');
            strongDesc.textContent = 'Description:';
            descLabel.appendChild(strongDesc);

            const descText = document.createElement('p');
            descText.style.whiteSpace = 'pre-wrap';
            descText.style.marginTop = '4px';
            descText.textContent = task.description || 'No message body.';

            wrapper.append(descLabel, descText);
            body.appendChild(wrapper);

            const modal = document.getElementById('taskModal');
            const approveBtn = document.getElementById('approveBtnModal');
            const rejectBtn = document.getElementById('rejectBtnModal');

            if (task.status === 'pending') {
                approveBtn.style.display = 'inline-block';
                rejectBtn.style.display = 'inline-block';
            } else {
                approveBtn.style.display = 'none';
                rejectBtn.style.display = 'none';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            currentTaskId = null;
        }

        function approveCurrentTask() {
            if (currentTaskId) {
                const id = currentTaskId;
                closeModal();
                approveTask(id);
            }
        }

        function rejectCurrentTask() {
            if (currentTaskId) {
                const id = currentTaskId;
                closeModal();
                rejectTask(id);
            }
        }

        async function logout() {
            const headers = buildAuthHeaders();
            const wasSignedIn = isAuthenticated || Boolean(sessionToken);
            sessionToken = null;
            isAuthenticated = false;
            currentUser = null;
            tasks = [];
            try { localStorage.removeItem('sessionToken'); } catch (_) {}

            if (wasSignedIn) {
                try {
                    await fetch(`${apiBase}/auth/logout`, {
                        method: 'POST',
                        credentials: 'include',
                        headers,
                    });
                } catch (_) {}
            }
            showAuthContainer();
        }

        function showAuthContainer() {
            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('syncStatus').style.display = 'none';
            document.getElementById('syncNowBtn').style.display = 'none';
            document.getElementById('signInBtn').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'none';
        }

        function showMainContent() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        async function bootstrap() {
            setupEventListeners();
            await resolveApiBase();

            const hash = window.location.hash || '';
            const hashMatch = hash.match(/oauth_code=([^&]+)/);
            const hashExchangeCode = hashMatch && hashMatch[1] ? decodeURIComponent(hashMatch[1]) : null;

            const params = new URLSearchParams(window.location.search);
            const exchangeCode = hashExchangeCode || params.get('exchange_code');
            const code = params.get('code');
            const state = params.get('state');
            const oauthError = params.get('oauth_error') || params.get('error');

            if (window.location.search || hashExchangeCode) {
                window.history.replaceState({}, document.title, window.location.pathname || '/');
            }

            if (oauthError) {
                showAuthContainer();
                showBanner(oauthError, 'error');
                return;
            }

            if (exchangeCode) {
                await redeemExchangeCode(exchangeCode);
                return;
            }

            if (code && state) {
                await handleOAuthCallback(code, state);
                return;
            }

            await restoreSession();
        }

        bootstrap();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshu - Personal AI Chief of Staff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-tertiary: #252d3d;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --accent-primary: #4a9eff;
            --accent-hover: #357abd;
            --border-color: #353d4f;
            --success: #34a853;
            --warning: #fbbc04;
            --danger: #ea4335;
            --spacing-xs: 8px;
            --spacing-sm: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent-primary);
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
        }

        .user-details {
            font-size: 14px;
        }

        .user-email {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-lg);
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--spacing-xs);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: var(--accent-primary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--spacing-lg);
        }

        .tab-button {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: var(--spacing-md) 0;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-button.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }

        .tab-button:hover {
            color: var(--text-primary);
        }

        /* Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .task-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            transition: all 0.2s;
            cursor: pointer;
        }

        .task-item:hover {
            border-color: var(--accent-primary);
            background: var(--bg-tertiary);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-sm);
        }

        .task-title {
            font-weight: 600;
            color: var(--text-primary);
        }

        .task-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(251, 188, 4, 0.1);
            color: var(--warning);
        }

        .status-approved {
            background: rgba(52, 168, 83, 0.1);
            color: var(--success);
        }

        .status-rejected {
            background: rgba(234, 67, 53, 0.1);
            color: var(--danger);
        }

        .task-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .task-description {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: var(--spacing-md);
            line-height: 1.6;
        }

        .task-actions {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
        }

        /* Buttons */
        .btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-success {
            background: rgba(52, 168, 83, 0.15);
            color: var(--success);
            border: 1px solid rgba(52, 168, 83, 0.3);
        }

        .btn-success:hover {
            background: rgba(52, 168, 83, 0.25);
        }

        .btn-danger {
            background: rgba(234, 67, 53, 0.15);
            color: var(--danger);
            border: 1px solid rgba(234, 67, 53, 0.3);
        }

        .btn-danger:hover {
            background: rgba(234, 67, 53, 0.25);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-signin {
            background: var(--accent-primary);
            color: white;
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: 14px;
        }

        .btn-signin:hover {
            background: var(--accent-hover);
        }

        /* Auth Container */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 200px);
            flex-direction: column;
            gap: var(--spacing-lg);
            text-align: center;
        }

        .auth-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 400px;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .auth-subtitle {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        /* Sync Status */
        .sync-status {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
        }

        .sync-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
            animation: pulse 2s infinite;
        }

        .sync-indicator.synced {
            background: var(--success);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: var(--spacing-lg);
            color: var(--text-primary);
        }

        .modal-footer {
            display: flex;
            gap: var(--spacing-md);
            justify-content: flex-end;
            margin-top: var(--spacing-lg);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">Joshu</div>
        <div class="header-actions">
            <div id="syncStatus" class="sync-status" style="display: none;">
                <div class="sync-indicator"></div>
                <span id="syncLabel">Syncing...</span>
            </div>
            <div id="userInfo" class="user-info" style="display: none;">
                <div class="avatar" id="userAvatar">J</div>
                <div>
                    <div id="userName" class="user-details"></div>
                    <div id="userEmail" class="user-email"></div>
                </div>
            </div>
            <button id="signInBtn" class="btn btn-signin">Sign In with Google</button>
            <button id="logoutBtn" class="btn btn-secondary" style="display: none;">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container" id="mainContent" style="display: none;">
        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Approved</div>
                <div class="stat-value" id="approvedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Rejected</div>
                <div class="stat-value" id="rejectedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-button active" data-tab="all">All Tasks</button>
            <button class="tab-button" data-tab="pending">Pending</button>
            <button class="tab-button" data-tab="approved">Approved</button>
            <button class="tab-button" data-tab="rejected">Rejected</button>
        </div>

        <!-- Tasks -->
        <div class="task-list" id="taskList">
            <div class="empty-state">
                <div class="empty-state-icon">📧</div>
                <div class="empty-state-title">No tasks yet</div>
                <p>Your approved and rejected meeting invitations will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Auth Container -->
    <div id="authContainer" class="auth-container">
        <div class="auth-box">
            <div class="auth-title">Joshu</div>
            <div class="auth-subtitle">Personal AI Chief of Staff</div>
            <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg); font-size: 14px;">
                Manage your meeting invitations and tasks in one place.
            </p>
            <button id="authSignInBtn" class="btn btn-signin" style="width: 100%;">Sign In with Google</button>
        </div>
    </div>

    <!-- Task Detail Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle"></div>
            <div id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                <button class="btn btn-danger" id="rejectBtnModal" onclick="rejectCurrentTask()">Reject</button>
                <button class="btn btn-success" id="approveBtnModal" onclick="approveCurrentTask()">Approve</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let sessionToken = localStorage.getItem('sessionToken');
        let currentUser = null;
        let currentTaskId = null;
        let tasks = [];

        // Initialize
        async function init() {
            if (sessionToken) {
                await loadUserProfile();
                await loadTasks();
            } else {
                showAuthContainer();
            }
            setupEventListeners();
        }

        function setupEventListeners() {
            document.getElementById('signInBtn').addEventListener('click', startSignIn);
            document.getElementById('authSignInBtn').addEventListener('click', startSignIn);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.addEventListener('click', (e) => filterTasks(e.target.dataset.tab));
            });
        }

        async function startSignIn() {
            try {
                const redirectUri = `${window.location.origin}/auth.html`;
                console.log('Starting sign-in with redirect_uri:', redirectUri);
                
                const response = await fetch(`${API_BASE}/auth/signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        redirect_uri: redirectUri
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    console.error('Sign-in error:', error);
                    alert('Sign-in failed: ' + (error.message || 'Unknown error'));
                    return;
                }

                const data = await response.json();
                console.log('Sign-in response:', data);
                
                if (data.redirect_url) {
                    console.log('Redirecting to:', data.redirect_url);
                    window.location.href = data.redirect_url;
                } else {
                    alert('No redirect URL received from server');
                }
            } catch (error) {
                console.error('Sign-in failed:', error);
                alert('Failed to start sign-in process: ' + error.message);
            }
        }

        async function handleOAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');

            console.log('OAuth callback params:', { code: code ? 'present' : 'missing', state: state ? 'present' : 'missing' });

            if (code && state) {
                try {
                    const callbackUrl = `${API_BASE}/auth/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;
                    console.log('Calling backend callback endpoint...');
                    
                    const response = await fetch(callbackUrl);
                    const data = await response.json();
                    
                    console.log('Backend response:', data);
                    
                    if (data.session_token) {
                        sessionToken = data.session_token;
                        localStorage.setItem('sessionToken', sessionToken);
                        currentUser = data.user;
                        console.log('OAuth successful, cleaning URL and initializing...');
                        window.history.replaceState({}, document.title, '/auth.html');
                        await loadUserProfile();
                        await loadTasks();
                    } else if (data.error) {
                        console.error('Backend error:', data.message);
                        alert('Authentication failed: ' + data.message);
                    }
                } catch (error) {
                    console.error('OAuth callback failed:', error);
                    alert('Authentication failed: ' + error.message);
                }
            } else {
                console.log('No OAuth params in URL, checking for existing session...');
            }
        }

        async function loadUserProfile() {
            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });
                const data = await response.json();
                currentUser = data.user;
                updateHeader();
                showMainContent();
            } catch (error) {
                console.error('Failed to load profile:', error);
                logout();
            }
        }

        async function loadTasks() {
            try {
                const response = await fetch(`${API_BASE}/tasks?limit=100`, {
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });
                const data = await response.json();
                tasks = data.tasks;
                updateStats(data.counts);
                displayTasks(tasks);
            } catch (error) {
                console.error('Failed to load tasks:', error);
            }
        }

        function updateHeader() {
            if (currentUser) {
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('signInBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('userName').textContent = currentUser.name;
                document.getElementById('userEmail').textContent = currentUser.email;
                const initials = currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase();
                document.getElementById('userAvatar').textContent = initials;
            }
        }

        function updateStats(counts) {
            document.getElementById('pendingCount').textContent = counts.pending;
            document.getElementById('approvedCount').textContent = counts.approved;
            document.getElementById('rejectedCount').textContent = counts.rejected;
            document.getElementById('totalCount').textContent = counts.all;
        }

        function displayTasks(tasksToShow) {
            const list = document.getElementById('taskList');
            
            if (tasksToShow.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✓</div>
                        <div class="empty-state-title">All caught up!</div>
                        <p>No tasks to show. Check back later.</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = tasksToShow.map(task => `
                <div class="task-item" onclick="openTaskModal('${task.id}')">
                    <div class="task-header">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-status status-${task.status}">${task.status}</div>
                    </div>
                    <div class="task-meta">
                        ${new Date(task.scheduled_for).toLocaleDateString()} at ${new Date(task.scheduled_for).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                    </div>
                    <div class="task-description">${escapeHtml(task.description)}</div>
                    <div class="task-actions">
                        ${task.status === 'pending' ? `
                            <button class="btn btn-danger" onclick="event.stopPropagation(); rejectTask('${task.id}')">Reject</button>
                            <button class="btn btn-success" onclick="event.stopPropagation(); approveTask('${task.id}')">Approve</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function filterTasks(filter) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (filter === 'all') {
                displayTasks(tasks);
            } else {
                displayTasks(tasks.filter(t => t.status === filter));
            }
        }

        async function approveTask(taskId) {
            try {
                await fetch(`${API_BASE}/tasks/${taskId}/approve`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });
                await loadTasks();
            } catch (error) {
                console.error('Failed to approve task:', error);
            }
        }

        async function rejectTask(taskId) {
            try {
                await fetch(`${API_BASE}/tasks/${taskId}/reject`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });
                await loadTasks();
            } catch (error) {
                console.error('Failed to reject task:', error);
            }
        }

        function openTaskModal(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            currentTaskId = taskId;
            document.getElementById('modalTitle').textContent = task.title;
            document.getElementById('modalBody').innerHTML = `
                <div style="color: var(--text-secondary); font-size: 14px;">
                    <p><strong>Status:</strong> ${task.status}</p>
                    <p><strong>Scheduled:</strong> ${new Date(task.scheduled_for).toLocaleString()}</p>
                    <p><strong>Source:</strong> ${task.source}</p>
                    <p style="margin-top: var(--spacing-md);"><strong>Description:</strong></p>
                    <p>${escapeHtml(task.description)}</p>
                </div>
            `;

            const modal = document.getElementById('taskModal');
            const approveBtn = document.getElementById('approveBtnModal');
            const rejectBtn = document.getElementById('rejectBtnModal');

            if (task.status === 'pending') {
                approveBtn.style.display = 'block';
                rejectBtn.style.display = 'block';
            } else {
                approveBtn.style.display = 'none';
                rejectBtn.style.display = 'none';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            currentTaskId = null;
        }

        function approveCurrentTask() {
            if (currentTaskId) {
                approveTask(currentTaskId);
                closeModal();
            }
        }

        function rejectCurrentTask() {
            if (currentTaskId) {
                rejectTask(currentTaskId);
                closeModal();
            }
        }

        async function logout() {
            try {
                await fetch(`${API_BASE}/auth/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });
            } catch (error) {
                console.error('Logout error:', error);
            }
            localStorage.removeItem('sessionToken');
            sessionToken = null;
            currentUser = null;
            showAuthContainer();
        }

        function showAuthContainer() {
            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('signInBtn').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'none';
        }

        function showMainContent() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Check for OAuth callback
        if (window.location.search.includes('code=') && window.location.search.includes('state=')) {
            console.log('OAuth callback detected, handling...');
            handleOAuthCallback();
        } else {
            console.log('No OAuth callback, initializing normally...');
            init();
        }
    </script>
</body>
</html>
